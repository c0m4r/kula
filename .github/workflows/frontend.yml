# Browser regressions for the dashboard, kept out of the main CI workflow so a
# hung browser cannot hold up vet, test and lint results. Each suite runs as its
# own step with a timeout several times its normal duration (local: dashboard
# ~45s, performance ~2s, live ~31s), and the job has an overall ceiling.
#
# Same security model as ci.yml: read-only token, no persisted credentials,
# only first-party actions/* pinned to full commit SHAs.

name: Frontend

on:
  push:
    branches: [main]
    paths: &frontend-paths
      - 'cmd/**'
      - 'internal/**'
      - 'config.example.yaml'
      - 'go.mod'
      - 'go.sum'
      - 'version.go'
      - 'VERSION'
      - 'addons/build.sh'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths: *frontend-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest # ships Google Chrome
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Assert no credentials persisted in the checkout
        run: |
          git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --local --unset-all credential.helper                    2>/dev/null || true
          rm -f "$HOME/.git-credentials"
          if git config --local --list | grep -iE 'extraheader|authorization|x-access-token' >/dev/null 2>&1; then
            echo "::error::Credential material present in .git/config" >&2
            exit 1
          fi
          echo "OK: no credentials persisted in the local checkout."

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22' # documented minimum for the browser fixtures

      - name: Build
        timeout-minutes: 5
        run: ./addons/build.sh

      - name: Dashboard regressions (controlled API)
        timeout-minutes: 5
        run: node --experimental-websocket internal/web/testdata/history_dashboard_test.mjs

      - name: Chart performance fixture
        timeout-minutes: 2
        run: node --experimental-websocket internal/web/testdata/history_performance_test.mjs

      - name: Live dashboard against kula serve
        timeout-minutes: 4
        env:
          KULA_BINARY: ./kula
        run: node --experimental-websocket internal/web/testdata/live_dashboard_test.mjs
