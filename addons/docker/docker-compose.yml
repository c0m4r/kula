services:
  kula:
    image: c0m4r/kula:latest
    container_name: kula
    pid: "host" # Critical for monitoring host processes
    network_mode: "host" # Useful for network monitoring, depending on kula's needs. Alternatively, map ports.

    # Kula needs no privileges: drop every capability, forbid gaining any
    # back, and keep the container's filesystem read-only. It writes only to
    # the data volume.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true

    volumes:
      # To monitor the host system, we need access to host's /proc
      - /proc:/proc:ro

      # Mount the configuration file from the host
      - ./config.yaml:/app/config.yaml:ro

      # Persist data
      - kula_data:/app/data

      # Logged-in users: Kula counts them from the host's utmp or
      # systemd-logind sessions. Uncomment whichever of the two the host has.
      # create_host_path: false makes Compose refuse a source the host lacks
      # instead of creating it as a directory.
      # - type: bind
      #   source: /run/utmp
      #   target: /run/utmp
      #   read_only: true
      #   bind:
      #     create_host_path: false
      # - type: bind
      #   source: /run/systemd/sessions
      #   target: /run/systemd/sessions
      #   read_only: true
      #   bind:
      #     create_host_path: false

    # Use 'serve' command
    command: [ "serve", "--config", "/app/config.yaml" ]

    restart: unless-stopped

volumes:
  kula_data:
